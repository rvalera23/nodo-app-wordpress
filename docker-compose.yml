services:
  wordpress:
    image: wordpress:latest
    container_name: wordpress_app
    restart: unless-stopped
    # Cargamos el archivo .env primero
    env_file:
      - .env
    # Forzamos la regeneración del wp-config.php en cada inicio
    entrypoint: >
      sh -c "rm -f /var/www/html/wp-config.php && docker-entrypoint.sh apache2-foreground"
    ports:
      - "8080:80"
    environment:
      # Inyectamos variables desde el archivo .env
      WORDPRESS_DB_HOST: ${REMOTE_DB_HOST}:3306
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_DB_NAME: wordpress_db
      
      # Optimización de PHP (Sin romper la sintaxis del YAML)
      PHP_UPLOAD_MAX_FILESIZE: 128M
      PHP_POST_MAX_SIZE: 256M
      
      # Inyección de configuraciones extra
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_MEMORY_LIMIT', '256M');
        define('WP_MAX_MEMORY_LIMIT', '512M');
        define('WP_POST_REVISIONS', 5);
        define('AUTOSAVE_INTERVAL', 120);
        define('DISABLE_WP_CRON', true);
        define('WP_DEBUG', true);
        define('WP_DEBUG_LOG', true);
        
    volumes:
      - ./wordpress_data:/var/www/html
