---
- name: Instalación Automática de Nodo WordPress
  hosts: all
  become: yes
  tasks:
    - name: FASE 1 - Asegurar Docker y dependencias
      apt:
        name:
          - docker.io
          - docker-compose
          - python3-pip
          - curl
          - git
        state: present
        update_cache: yes

    - name: FASE 2 - Crear directorios de persistencia y backups
      file:
        path: "/opt/servicios/nodo-app-wordpress/wordpress_data"
        state: directory
        mode: '0755'
        owner: "33"
        group: "33"

    - name: FASE 2.1 - Estructura jerárquica de backups con herencia de permisos
      file:
        path: "/opt/servicios/nodo-app-wordpress/backups/wordpress_files"
        state: directory
        mode: '0755'
        owner: "33"
        group: "33"
        recurse: yes

    - name: FASE 2.2 - Pull de la imagen oficial
      shell: "docker pull wordpress:latest"

    - name: FASE 2.5 - Limpieza de residuos
      shell: |
        docker compose down -v || true
        rm -rf /opt/servicios/nodo-app-wordpress/wordpress_data/*
      args:
        chdir: /opt/servicios/nodo-app-wordpress/

    - name: FASE 3 - Lanzar WordPress conectado a DB remota
      shell: "cd /opt/servicios/nodo-app-wordpress && docker compose up -d"
