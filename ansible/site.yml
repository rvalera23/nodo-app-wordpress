---
- name: Instalación Automática de Nodo WordPress
  hosts: all
  become: yes
  tasks:
    - name: FASE 1 - Asegurar Docker y dependencias instaladas
      apt:
        name: [docker.io, docker-compose-v2, python3-pip]
        state: present
        update_cache: yes

    - name: FASE 3 - Crear directorio de persistencia
      file:
        path: "/opt/servicios/nodo-app-wordpress/wordpress_data"
        state: directory
        mode: '0755'
        owner: 33 # Usuario www-data de WordPress
        group: 33

    - name: FASE 4.2 - Pull de la imagen oficial
      shell: "docker pull wordpress:latest"

    - name: FASE 5 - Lanzar WordPress conectado a DB remota
      shell: "cd /opt/servicios/nodo-app-wordpress && docker compose up -d"
