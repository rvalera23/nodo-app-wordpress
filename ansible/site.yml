---
- name: Instalación Profesional de Nodo WordPress
  hosts: all
  become: yes
  vars_files:
    - group_vars/all.yml

  tasks:
    - name: FASE 1 - Instalación de dependencias
      apt:
        name: [docker.io, docker-compose, python3-pip, curl, git, net-tools, ufw]
        state: present
        update_cache: yes

    - name: FASE 2 - Estructura de carpetas y permisos
      file:
        path: "/opt/servicios/nodo-app-wordpress/{{ item }}"
        state: directory
        owner: "33" # Usuario www-data
        group: "33"
        mode: '0755'
      with_items: ['wordpress_data', 'backups/wordpress_files']

    - name: FASE 3 - Asegurar Redes
      shell: "docker network ls | grep -q nodo_net || docker network create nodo_net"

    - name: FASE 4 - Desplegar configuración desde plantilla
      template:
        src: templates/docker-compose.yml.j2
        dest: /opt/servicios/nodo-app-wordpress/docker-compose.yml
        mode: '0644'

    - name: FASE 5 - Lanzamiento del ecosistema
      shell: "cd /opt/servicios/nodo-app-wordpress && docker compose up -d"
      register: deploy_result
      changed_when: "'Created' in deploy_result.stdout or 'Recreated' in deploy_result.stdout"
